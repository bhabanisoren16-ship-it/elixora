    <script>
      // Lock viewport height to physical screen size once to prevent address bar collapse zoom
      try {
        var h = Math.max(window.innerHeight, (window.screen && window.screen.height) || 0, 850);
        document.documentElement.style.setProperty('--locked-screen-height', h + 'px');
      } catch (e) {}

      // Force manual scroll restoration so refreshing never jumps to #register or any section
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      try {
        var hash = window.location.hash;
        if (hash && hash !== '#admin' && !hash.includes('senior')) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      } catch (e) {}
      window.scrollTo(0, 0);

      // Prevent accidental pinch-to-zoom and multi-touch zooming during scroll
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) { e.preventDefault(); }
      }, { passive: false });
    </script>
